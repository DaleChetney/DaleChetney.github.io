<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Generator Visualizer — dalechetney.github.io</title>
    <style>
      :root {
        color-scheme: light dark;
        --panel: color-mix(in srgb, canvas 92%, canvastext 8%);
        --edge: color-mix(in srgb, canvas 76%, canvastext 24%);
        /*
          The color of being one element short of generating the group, and of
          having got there. Generator colors are spread over the whole wheel, so
          no hue can be kept clear of them; what sets this apart is that a
          generator color fills a label and this one only ever strokes an outline.
        */
        --completing: light-dark(#0e7a4e, #4fcf9a);
        font-family: system-ui, sans-serif;
      }

      body {
        --left: 240px;
        --right: 300px;
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: var(--left) 1fr var(--right);
        gap: 1px;
        background: var(--edge);
      }

      /*
        A folded side panel keeps only the strip its toggle sits in, and the
        center panel takes the rest: on a narrow screen the diagram is what the
        page is for.
      */
      body:has(#panel-left.collapsed) {
        --left: 2.25rem;
      }

      body:has(#panel-right.collapsed) {
        --right: 2.25rem;
      }

      .panel-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.75rem;
      }

      .panel-header h2 {
        flex: 1;
        margin: 0;
      }

      .panel-toggle {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid var(--edge);
        border-radius: 0.35rem;
        width: 1.5rem;
        height: 1.5rem;
        padding: 0;
        cursor: pointer;
        opacity: 0.6;
        flex: none;
      }

      .panel-toggle:hover {
        opacity: 1;
        background: var(--panel);
      }

      /* The chevron points the way the panel will move. */
      #panel-left .panel-toggle::before,
      #panel-right.collapsed .panel-toggle::before {
        content: "‹";
      }

      #panel-right .panel-toggle::before,
      #panel-left.collapsed .panel-toggle::before {
        content: "›";
      }

      section.collapsed {
        padding: 1rem 0.375rem;
      }

      section.collapsed > :not(.panel-header),
      section.collapsed .panel-header > :not(.panel-toggle) {
        display: none;
      }

      section {
        background: canvas;
        padding: 1rem;
        overflow: auto;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0;
      }

      h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin: 0 0 0.75rem;
      }

      .placeholder {
        opacity: 0.5;
        font-size: 0.85rem;
      }

      .stage-header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        margin-bottom: 0.25rem;
      }

      #group-label {
        font-size: 0.8rem;
        opacity: 0.65;
        color: inherit;
      }

      /* The list scrolls; the search box and count above it stay put. */
      #panel-left {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #group-search {
        font: inherit;
        padding: 0.35rem 0.5rem;
        border: 1px solid var(--edge);
        border-radius: 0.35rem;
        background: canvas;
        color: canvastext;
      }

      #group-count {
        margin: 0.5rem 0 0.35rem;
      }

      #group-list {
        overflow: auto;
        flex: 1;
        margin: 0 -0.35rem;
      }

      .group-row {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        border-radius: 0.35rem;
        padding: 0.3rem 0.35rem;
        cursor: pointer;
      }

      .group-row:hover {
        background: var(--panel);
      }

      .group-row.selected {
        background: color-mix(in srgb, canvas 84%, canvastext 16%);
      }

      .group-name {
        font-size: 0.95rem;
      }

      .group-meta {
        font-size: 0.7rem;
        opacity: 0.55;
      }

      .representation-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3rem;
        margin-top: 0.35rem;
      }

      .representation {
        font: inherit;
        font-size: 0.75rem;
        color: inherit;
        background: none;
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 0.12rem 0.55rem;
        cursor: pointer;
      }

      .representation:hover {
        background: var(--panel);
      }

      .representation.selected {
        background: color-mix(in srgb, canvas 84%, canvastext 16%);
        border-color: currentColor;
      }

      #diagram {
        display: grid;
        place-items: center;
        margin: 1rem 0;
      }

      .diagram {
        max-width: 100%;
        height: auto;
      }

      .diagram .node {
        cursor: pointer;
      }

      .diagram .node circle {
        fill: var(--panel);
        stroke: currentColor;
        stroke-width: 1.5;
      }

      .diagram .node:hover circle {
        fill: color-mix(in srgb, var(--panel) 88%, canvastext 12%);
      }

      /* Picked to be swapped with the next node clicked. */
      .diagram .node.picked circle {
        stroke: var(--completing);
        stroke-width: 2.5;
      }

      .diagram .node text {
        font-size: 15px;
        fill: currentColor;
      }

      .diagram .node:focus {
        outline: none;
      }

      .diagram .node:focus-visible circle {
        stroke-width: 2.5;
      }

      .element-sections {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }

      .element-section h3 {
        font-size: 0.9rem;
        font-style: italic;
        margin: 0 0 0.35rem;
      }

      .element-section .muted {
        font-style: normal;
        font-weight: 400;
        font-size: 0.72rem;
        opacity: 0.55;
      }

      .conjugate h4 {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.5;
        margin: 0.45rem 0 0.2rem;
      }

      .element {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.12rem 0;
        cursor: pointer;
      }

      .element code {
        font-size: 0.78rem;
      }

      .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        flex: none;
      }

      .element input:not(:checked) + .swatch {
        opacity: 0.25;
      }

      /*
        The lattice is scaled whole rather than re-laid-out, since stretching a
        Hasse diagram is just a bigger picture of the same thing. 60% is the
        ceiling: renderLattice sizes the SVG to a share of it so that nodes come
        out the same size in every lattice, and only one past ten columns wide
        has to shrink to fit.
      */
      #lattice-panel {
        max-width: 60%;
      }

      .hint {
        font-size: 0.8rem;
        opacity: 0.65;
        margin: 0 0 0.5rem;
      }

      .lattice {
        max-width: 100%;
        height: auto;
        overflow: visible;
      }

      .lattice-edges line {
        stroke: currentColor;
        stroke-width: 1;
        opacity: 0.4;
      }

      /*
        The covers inside the sublattice the selection has generated so far:
        every one with both ends at or below the generated class. Once the
        group is generated that is all of them.
      */
      .lattice-edges line.generated {
        stroke: var(--completing);
        stroke-width: 1.5;
        opacity: 1;
      }

      .lattice-node text {
        font-size: 15px;
        font-style: italic;
        fill: currentColor;
      }

      .lattice-node rect {
        fill: transparent;
      }

      .lattice-node.fixed {
        opacity: 0.7;
      }

      .lattice-node.selectable {
        cursor: pointer;
      }

      .lattice-node.selectable:hover rect {
        fill: color-mix(in srgb, canvas 88%, canvastext 12%);
      }

      .lattice-node.selected rect {
        fill: color-mix(in srgb, canvas 84%, canvastext 16%);
      }

      /*
        Solid on the class the selection generates so far, which is the group
        itself once it is complete, and on the classes that did it; dashed
        while an element that would complete the generating set is still to be
        picked.
      */
      .lattice-node.generated rect,
      .lattice-node.completing rect,
      .lattice-node.generating rect {
        stroke: var(--completing);
        stroke-width: 1.5;
      }

      .lattice-node.completing rect {
        stroke-dasharray: 3 3;
      }

      /*
        A click leaves the node focused so the keyboard can carry on from it, but
        the browser's own ring belongs to the keyboard, and on an SVG element it
        is drawn for a click too. :focus-visible is what tells the two apart.
      */
      .lattice-node:focus {
        outline: none;
      }

      .lattice-node:focus-visible rect {
        stroke: currentColor;
        stroke-width: 2;
        stroke-dasharray: none;
      }
    </style>
  </head>
  <body>
    <section id="panel-left">
      <div class="panel-header">
        <h2>Group</h2>
        <button class="panel-toggle" type="button" aria-label="Toggle group list"></button>
      </div>
      <input
        id="group-search"
        type="search"
        placeholder="Name or label"
        autocomplete="off"
        aria-label="Filter groups"
      />
      <p id="group-count" class="hint"></p>
      <div id="group-list"></div>
    </section>

    <section id="panel-main">
      <div class="stage-header">
        <h1 id="group-name"></h1>
        <a id="group-label" target="_blank" rel="noreferrer"></a>
      </div>
      <div id="representation-row"></div>
      <div id="diagram"></div>
      <div id="lattice-panel">
        <h2>Subgroups up to conjugacy</h2>
        <p class="hint">
          Click a cyclic subgroup to draw one of its generators. An outlined subgroup has an element
          that would complete the selection into a generating set; the outline turns solid once it
          is one.
        </p>
        <div id="lattice"></div>
      </div>
    </section>

    <section id="panel-right">
      <div class="panel-header">
        <button class="panel-toggle" type="button" aria-label="Toggle generator list"></button>
        <h2>Generators</h2>
      </div>
      <div id="element-sections"></div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
