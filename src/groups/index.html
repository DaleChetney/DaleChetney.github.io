<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Abstract Groups — dalechetney.github.io</title>
    <style>
      :root {
        color-scheme: light dark;
        --panel: color-mix(in srgb, canvas 92%, canvastext 8%);
        --edge: color-mix(in srgb, canvas 76%, canvastext 24%);
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr 300px;
        gap: 1px;
        background: var(--edge);
      }

      section {
        background: canvas;
        padding: 1rem;
        overflow: auto;
      }

      h1 {
        font-size: 1.25rem;
        margin: 0;
      }

      h2 {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.6;
        margin: 0 0 0.75rem;
      }

      .placeholder {
        opacity: 0.5;
        font-size: 0.85rem;
      }

      .stage-header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
        margin-bottom: 0.25rem;
      }

      #group-label,
      #representation-title {
        font-size: 0.8rem;
        opacity: 0.65;
      }

      #diagram {
        display: grid;
        place-items: center;
        margin: 1rem 0;
      }

      .diagram {
        max-width: 100%;
        height: auto;
      }

      .diagram .node circle {
        fill: var(--panel);
        stroke: currentColor;
        stroke-width: 1.5;
      }

      .diagram .node text {
        font-size: 15px;
        fill: currentColor;
      }

      .element-sections {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }

      .element-section h3 {
        font-size: 0.9rem;
        font-style: italic;
        margin: 0 0 0.35rem;
      }

      .element-section .muted {
        font-style: normal;
        font-weight: 400;
        font-size: 0.72rem;
        opacity: 0.55;
      }

      .conjugate h4 {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.5;
        margin: 0.45rem 0 0.2rem;
      }

      .element {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.12rem 0;
        cursor: pointer;
      }

      .element code {
        font-size: 0.78rem;
      }

      .swatch {
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        flex: none;
      }

      .element input:not(:checked) + .swatch {
        opacity: 0.25;
      }

      #lattice-panel {
        max-width: 24rem;
      }

      .hint {
        font-size: 0.8rem;
        opacity: 0.65;
        margin: 0 0 0.5rem;
      }

      .lattice {
        max-width: 100%;
        height: auto;
        overflow: visible;
      }

      .lattice-edges line {
        stroke: currentColor;
        stroke-width: 1;
        opacity: 0.4;
      }

      .lattice-node text {
        font-size: 15px;
        font-style: italic;
        fill: currentColor;
      }

      .lattice-node rect {
        fill: transparent;
      }

      .lattice-node.fixed {
        opacity: 0.7;
      }

      .lattice-node.selectable {
        cursor: pointer;
      }

      .lattice-node.selectable:hover rect {
        fill: color-mix(in srgb, canvas 88%, canvastext 12%);
      }

      .lattice-node.selected rect {
        fill: color-mix(in srgb, canvas 84%, canvastext 16%);
      }

      .lattice-node.completing rect {
        stroke: currentColor;
        stroke-dasharray: 3 3;
        opacity: 0.75;
      }

      .lattice-node:focus-visible {
        outline: none;
      }

      .lattice-node:focus-visible rect {
        stroke: currentColor;
        stroke-width: 2;
      }
    </style>
  </head>
  <body>
    <section id="panel-left">
      <h2>Group</h2>
      <p class="placeholder">Group and representation selection lands here.</p>
    </section>

    <section id="panel-main">
      <div class="stage-header">
        <h1 id="group-name"></h1>
        <span id="group-label"></span>
      </div>
      <div id="representation-title"></div>
      <div id="diagram"></div>
      <div id="lattice-panel">
        <h2>Subgroups up to conjugacy</h2>
        <p class="hint">
          Click a cyclic subgroup to draw one of its generators. Dashed nodes would complete the
          selection into a generating set.
        </p>
        <div id="lattice"></div>
      </div>
    </section>

    <section id="panel-right">
      <h2>Generators</h2>
      <div id="element-sections"></div>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
